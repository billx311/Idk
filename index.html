<!DOCTYPE HTML>
<html>
  <body>
    <p id="timer">Countdown</p>
    <script>
      
      function updateCountdown(){
      const mun_day = new Date("2026-11-19T00:00:00+05:00");
      const now_day = new Date();
      const dif = mun_day-now_day;
      const days = Math.floor(dif/(1000*60*60*24));
      const hours = Math.floor(dif/(1000*60*60)%24);
      const min = Math.floor(dif/(1000*60)%60);
      const sec = Math.floor(dif/(1000)%60);
      setInterval(updateCountdown, 1000);
      }
      
      document.getElementById("timer").textContent = `$(days)days, $(hours)hours, $(min)minutes, $(sec)seconds`;
      
      
    </script>
  </body>
</html>
